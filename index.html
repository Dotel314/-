<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>줄넘기 리듬 카운터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .tap-active {
      transform: scale(0.98);
      background-color: rgba(59, 130, 246, 0.08);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 px-4 py-3 flex items-center justify-between z-20">
    <div class="flex items-center gap-2">
      <div class="p-2 bg-blue-600 rounded-lg text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8"/><path d="M4 16l3-8 3 8"/><path d="M2 21h20"/><path d="M7 12h10"/></svg>
      </div>
      <h1 class="font-bold text-lg text-slate-100">줄넘기 카운터</h1>
    </div>
    <button id="reset-btn" class="px-3 py-1.5 text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg hover:bg-rose-500/30 transition">
      초기화
    </button>
  </header>

  <!-- Main Dashboard -->
  <main id="tap-area" class="flex-1 flex flex-col p-4 gap-4 max-w-md mx-auto w-full justify-between transition-colors duration-100 cursor-pointer">
    
    <!-- Top Row Stats: Timer & Target Pace -->
    <div class="grid grid-cols-2 gap-3 z-10">
      <!-- Stopwatch -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3 flex flex-col justify-between">
        <span class="text-xs font-medium text-slate-400">스톱워치</span>
        <div id="stopwatch-display" class="text-2xl font-mono font-bold text-emerald-400 my-1">00:00.0</div>
        <div class="flex gap-1.5 mt-1">
          <button id="timer-toggle-btn" class="flex-1 py-1 bg-emerald-600/30 text-emerald-300 text-xs rounded border border-emerald-500/30 font-medium">시작</button>
        </div>
      </div>

      <!-- Target Time & Goal Calculation -->
      <div id="target-card" class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-3 flex flex-col justify-between">
        <div class="flex justify-between items-center">
          <span class="text-xs font-medium text-slate-400">목표 예상</span>
          <div class="flex items-center gap-1 bg-slate-900/80 rounded px-1.5 py-0.5 border border-slate-700">
            <button id="target-minus" class="text-xs text-slate-300 font-bold px-1 disabled:opacity-30">-</button>
            <span id="target-time-label" class="text-[11px] font-mono text-blue-400 font-semibold">0:30</span>
            <button id="target-plus" class="text-xs text-slate-300 font-bold px-1 disabled:opacity-30">+</button>
          </div>
        </div>
        <div class="my-1">
          <span id="estimated-count" class="text-2xl font-mono font-bold text-blue-400">0</span>
          <span class="text-xs text-slate-400">회</span>
        </div>
        <div id="target-status" class="text-[10px] text-slate-400 truncate">평균 속도 기준 예상</div>
      </div>
    </div>

    <!-- Main Count Display -->
    <div class="flex-1 flex flex-col items-center justify-center my-2 pointer-events-none">
      <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase mb-1">Jump Count</span>
      <div id="jump-count" class="text-7xl font-extrabold text-white font-mono tracking-tight">0</div>
      <span class="text-xs text-slate-500 mt-3 animate-pulse">화면 아무 곳이나 탭하여 카운트</span>
    </div>

    <!-- Speed Meters (Instant & Average) -->
    <div class="grid grid-cols-2 gap-3 z-10">
      <!-- Instant Speed -->
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5 flex flex-col gap-1">
        <span class="text-xs font-medium text-slate-400">순간 속도</span>
        <div class="flex items-baseline gap-1.5">
          <span id="inst-bpm" class="text-3xl font-bold font-mono text-amber-400">0</span>
          <span class="text-xs font-semibold text-amber-400/80">BPM</span>
        </div>
        <div class="text-xs text-slate-400 font-mono">
          <span id="inst-bps">0.0</span> <span class="text-[10px] text-slate-500">BPS</span>
        </div>
      </div>

      <!-- Average Speed -->
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3.5 flex flex-col gap-1">
        <span class="text-xs font-medium text-slate-400">평균 속도</span>
        <div class="flex items-baseline gap-1.5">
          <span id="avg-bpm" class="text-3xl font-bold font-mono text-indigo-400">0</span>
          <span class="text-xs font-semibold text-indigo-400/80">BPM</span>
        </div>
        <div class="text-xs text-slate-400 font-mono">
          <span id="avg-bps">0.0</span> <span class="text-[10px] text-slate-500">BPS</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Reset Confirmation Modal -->
  <div id="reset-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 max-w-xs w-full text-center shadow-xl">
      <h3 class="text-base font-bold text-slate-100 mb-2">기록을 초기화할까요?</h3>
      <p class="text-xs text-slate-400 mb-5">측정된 카운터, 시간, 속도 데이터가 모두 0으로 설정됩니다.</p>
      <div class="flex gap-2">
        <button id="modal-cancel" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-medium text-slate-300">취소</button>
        <button id="modal-confirm" class="flex-1 py-2 bg-rose-600 hover:bg-rose-500 rounded-lg text-xs font-medium text-white">초기화</button>
      </div>
    </div>
  </div>

  <script>
    // State Variables
    let count = 0;
    let startTime = null;
    let elapsedMs = 0;
    let timerInterval = null;
    let calcInterval = null;
    let isRunning = false;

    let tapHistory = []; // Recent tap timestamps for smoothing instant BPM
    let lastTapTime = null;

    // Target Time (seconds) : 30s to 180s (3m)
    const TARGET_STEPS = [30, 60, 90, 120, 150, 180];
    let targetStepIdx = 0; // default 30s

    // DOM Elements
    const tapArea = document.getElementById('tap-area');
    const jumpCountEl = document.getElementById('jump-count');
    const stopwatchEl = document.getElementById('stopwatch-display');
    const timerToggleBtn = document.getElementById('timer-toggle-btn');
    
    const instBpmEl = document.getElementById('inst-bpm');
    const instBpsEl = document.getElementById('inst-bps');
    const avgBpmEl = document.getElementById('avg-bpm');
    const avgBpsEl = document.getElementById('avg-bps');

    const targetTimeLabel = document.getElementById('target-time-label');
    const estimatedCountEl = document.getElementById('estimated-count');
    const targetCard = document.getElementById('target-card');
    const targetStatus = document.getElementById('target-status');
    const targetMinusBtn = document.getElementById('target-minus');
    const targetPlusBtn = document.getElementById('target-plus');

    const resetBtn = document.getElementById('reset-btn');
    const resetModal = document.getElementById('reset-modal');
    const modalCancel = document.getElementById('modal-cancel');
    const modalConfirm = document.getElementById('modal-confirm');

    // Format Seconds to MM:SS
    function formatTargetTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Format Stopwatch MM:SS.ms
    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      const msDec = Math.floor((ms % 1000) / 100);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}.${msDec}`;
    }

    // Update Stopwatch Display
    function updateStopwatch() {
      if (isRunning) {
        elapsedMs = Date.now() - startTime;
      }
      stopwatchEl.textContent = formatTime(elapsedMs);
    }

    // Main Calculator Loop (Runs every 1s)
    function updateCalculations() {
      const currentElapsedSec = elapsedMs / 1000;

      // Auto-step up Target Time if stopwatch exceeds current target
      let currentTargetSec = TARGET_STEPS[targetStepIdx];
      while (currentElapsedSec > currentTargetSec && targetStepIdx < TARGET_STEPS.length - 1) {
        targetStepIdx++;
        currentTargetSec = TARGET_STEPS[targetStepIdx];
      }
      updateTargetUI();

      // Check 3 Minutes (180s) Limit Exceeded
      const isExceeded3Min = currentElapsedSec > 180;

      // 1. Calculate Average BPM & BPS
      let avgBpm = 0;
      let avgBps = 0;

      if (currentElapsedSec > 0 && count > 0) {
        avgBps = count / currentElapsedSec;
        avgBpm = avgBps * 60;
      }

      avgBpmEl.textContent = Math.round(avgBpm);
      avgBpsEl.textContent = avgBps.toFixed(1);

      // 2. Calculate Estimated Count for Target Time
      if (isExceeded3Min) {
        targetCard.classList.add('opacity-50');
        estimatedCountEl.textContent = "OFF";
        targetStatus.textContent = "3분 초과 (비활성화)";
      } else {
        targetCard.classList.remove('opacity-50');
        if (avgBpm > 0) {
          const estimated = Math.round(avgBps * currentTargetSec);
          estimatedCountEl.textContent = estimated;
          targetStatus.textContent = `${formatTargetTime(currentTargetSec)} 동안 예상 횟수`;
        } else {
          estimatedCountEl.textContent = "0";
          targetStatus.textContent = "평균 속도 기준 예상";
        }
      }

      // Clear instant speed if idle for more than 2 seconds
      if (lastTapTime && (Date.now() - lastTapTime > 2000)) {
        instBpmEl.textContent = "0";
        instBpsEl.textContent = "0.0";
        tapHistory = [];
      }
    }

    // Target Time UI State Handler
    function updateTargetUI() {
      const currentTargetSec = TARGET_STEPS[targetStepIdx];
      const currentElapsedSec = elapsedMs / 1000;

      targetTimeLabel.textContent = formatTargetTime(currentTargetSec);

      // Disable minus button if decreasing would drop target below current stopwatch time or step limit
      const prevStepSec = targetStepIdx > 0 ? TARGET_STEPS[targetStepIdx - 1] : 0;
      if (targetStepIdx === 0 || currentElapsedSec >= currentTargetSec || currentElapsedSec > prevStepSec) {
        targetMinusBtn.disabled = true;
      } else {
        targetMinusBtn.disabled = false;
      }

      // Plus button disabled if max step (3 mins) reached
      targetPlusBtn.disabled = (targetStepIdx >= TARGET_STEPS.length - 1);
    }

    // Handle Tap Event
    function handleTap(e) {
      // Prevent double firing on touch devices & exclude button clicks
      if (e.target.closest('button')) return;
      if (e.type === 'touchstart') e.preventDefault();

      const now = Date.now();

      // Filter out duplicate taps or physically impossible speeds (< 120ms = > 500 BPM)
      if (lastTapTime && (now - lastTapTime < 120)) {
        return;
      }

      // Auto start stopwatch on first tap
      if (!isRunning && count === 0) {
        startTimer();
      }

      count++;
      jumpCountEl.textContent = count;

      // Tap Animation Effect
      tapArea.classList.add('tap-active');
      setTimeout(() => tapArea.classList.remove('tap-active'), 80);

      // Instant BPM calculation (using moving average of last 5 tap intervals)
      if (lastTapTime) {
        const intervalSec = (now - lastTapTime) / 1000;
        tapHistory.push(intervalSec);
        if (tapHistory.length > 5) tapHistory.shift();

        const avgInterval = tapHistory.reduce((a, b) => a + b, 0) / tapHistory.length;
        const instBps = 1 / avgInterval;
        const instBpm = instBps * 60;

        instBpmEl.textContent = Math.round(instBpm);
        instBpsEl.textContent = instBps.toFixed(1);
      }

      lastTapTime = now;
      updateCalculations();
    }

    // Timer Controls
    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      startTime = Date.now() - elapsedMs;
      timerInterval = setInterval(updateStopwatch, 100);
      calcInterval = setInterval(updateCalculations, 1000);
      timerToggleBtn.textContent = "일시정지";
      timerToggleBtn.className = "flex-1 py-1 bg-amber-600/30 text-amber-300 text-xs rounded border border-amber-500/30 font-medium";
    }

    function pauseTimer() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      clearInterval(calcInterval);
      timerToggleBtn.textContent = "재개";
      timerToggleBtn.className = "flex-1 py-1 bg-emerald-600/30 text-emerald-300 text-xs rounded border border-emerald-500/30 font-medium";
    }

    // Reset All Data
    function resetAll() {
      pauseTimer();
      count = 0;
      elapsedMs = 0;
      tapHistory = [];
      lastTapTime = null;
      targetStepIdx = 0;

      jumpCountEl.textContent = "0";
      stopwatchEl.textContent = "00:00.0";
      instBpmEl.textContent = "0";
      instBpsEl.textContent = "0.0";
      avgBpmEl.textContent = "0";
      avgBpsEl.textContent = "0.0";
      estimatedCountEl.textContent = "0";

      timerToggleBtn.textContent = "시작";
      timerToggleBtn.className = "flex-1 py-1 bg-emerald-600/30 text-emerald-300 text-xs rounded border border-emerald-500/30 font-medium";

      updateTargetUI();
      updateCalculations();
    }

    // Event Listeners
    tapArea.addEventListener('touchstart', handleTap, { passive: false });
    tapArea.addEventListener('click', handleTap);

    timerToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isRunning) pauseTimer();
      else startTimer();
    });

    targetMinusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (targetStepIdx > 0) {
        targetStepIdx--;
        updateTargetUI();
        updateCalculations();
      }
    });

    targetPlusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (targetStepIdx < TARGET_STEPS.length - 1) {
        targetStepIdx++;
        updateTargetUI();
        updateCalculations();
      }
    });

    // Modal Control
    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetModal.classList.remove('hidden');
      resetModal.classList.add('flex');
    });

    modalCancel.addEventListener('click', () => {
      resetModal.classList.add('hidden');
      resetModal.classList.remove('flex');
    });

    modalConfirm.addEventListener('click', () => {
      resetModal.classList.add('hidden');
      resetModal.classList.remove('flex');
      resetAll();
    });

    // Initial Setup
    updateTargetUI();
  </script>
</body>
</html>
