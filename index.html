<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>줄넘기 리듬 카운터</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-secondary: #4ade80;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .reset-btn {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-danger);
            border: 1px solid var(--accent-danger);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:active {
            background-color: var(--accent-danger);
            color: white;
        }

        /* 컨트롤 영역 */
        .controls-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            background-color: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .control-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.6rem 0.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .control-title {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 0.2rem;
        }

        .timer-display {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: monospace;
            color: var(--accent-primary);
        }

        .target-adjuster {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .adjust-btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .adjust-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .target-val {
            font-size: 0.95rem;
            font-weight: 700;
            min-width: 50px;
            text-align: center;
        }

        /* 메인 터치 및 카운터 영역 */
        .touch-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 1.5rem;
            cursor: pointer;
            position: relative;
        }

        .touch-zone::after {
            content: "화면을 탭하여 줄넘기 카운트";
            position: absolute;
            bottom: 1rem;
            font-size: 0.8rem;
            color: var(--text-sub);
            opacity: 0.6;
        }

        .counter-box {
            text-align: center;
        }

        .counter-label {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .count-value {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--text-main);
            transition: transform 0.05s ease;
        }

        .count-value.pop {
            transform: scale(1.1);
            color: var(--accent-primary);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem;
            text-align: center;
            transition: opacity 0.3s;
        }

        .metric-card.disabled {
            opacity: 0.35;
        }

        .metric-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 0.4rem;
        }

        .metric-main-val {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-secondary);
        }

        .metric-sub-val {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 0.2rem;
        }

        .prediction-card {
            grid-column: span 2;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--accent-primary);
        }

        .prediction-card .metric-main-val {
            color: var(--accent-primary);
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 1.25rem;
        }

        .modal-btns {
            display: flex;
            gap: 0.5rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.cancel {
            background-color: var(--border-color);
            color: var(--text-main);
        }

        .modal-btn.confirm {
            background-color: var(--accent-danger);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>JumpRope Rhythm</h1>
        <button class="reset-btn" id="resetBtn">초기화</button>
    </header>

    <div class="controls-bar">
        <div class="control-card">
            <span class="control-title">스톱워치</span>
            <span class="timer-display" id="timerDisplay">00:00.0</span>
        </div>
        <div class="control-card">
            <span class="control-title">목표 시간 설정</span>
            <div class="target-adjuster">
                <button class="adjust-btn" id="minusTargetBtn">-</button>
                <span class="target-val" id="targetDisplay">30초</span>
                <button class="adjust-btn" id="plusTargetBtn">+</button>
            </div>
        </div>
    </div>

    <main class="touch-zone" id="touchZone">
        <div class="counter-box">
            <div class="counter-label">Total Jumps</div>
            <div class="count-value" id="countDisplay">0</div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">순간 속도 (Real-time)</div>
                <div class="metric-main-val" id="instantBpmDisplay">0 <span style="font-size:0.9rem">BPM</span></div>
                <div class="metric-sub-val" id="instantBpsDisplay">0.0 BPS</div>
            </div>

            <div class="metric-card">
                <div class="metric-title">평균 속도 (Average)</div>
                <div class="metric-main-val" id="avgBpmDisplay">0 <span style="font-size:0.9rem">BPM</span></div>
                <div class="metric-sub-val" id="avgBpsDisplay">0.0 BPS</div>
            </div>

            <div class="metric-card prediction-card" id="predictionCard">
                <div class="metric-title" id="predictionTitle">목표 시간(30초) 예상 횟수</div>
                <div class="metric-main-val" id="predictionDisplay">0 회</div>
                <div class="metric-sub-val">현재 평균 속도 기준</div>
            </div>
        </div>
    </main>

    <!-- 초기화 확인 모달 -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal-box">
            <div class="modal-title">카운터 초기화</div>
            <div class="modal-desc">모든 기록과 스톱워치를 초기화하시겠습니까?</div>
            <div class="modal-btns">
                <button class="modal-btn cancel" id="cancelResetBtn">취소</button>
                <button class="modal-btn confirm" id="confirmResetBtn">초기화</button>
            </div>
        </div>
    </div>

    <script>
        // 상태 변수
        let count = 0;
        let targetSeconds = 30; // 기본 30초 (30 ~ 180)
        let timerInterval = null;
        let updateInterval = null;
        let elapsedMilliseconds = 0;
        let isTimerRunning = false;

        let tapTimes = []; // 최근 탭 타임스탬프 (이동 평균용)
        let firstTapTime = null;
        let lastTapTime = null;

        // DOM 요소
        const touchZone = document.getElementById('touchZone');
        const countDisplay = document.getElementById('countDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const targetDisplay = document.getElementById('targetDisplay');
        const minusTargetBtn = document.getElementById('minusTargetBtn');
        const plusTargetBtn = document.getElementById('plusTargetBtn');

        const instantBpmDisplay = document.getElementById('instantBpmDisplay');
        const instantBpsDisplay = document.getElementById('instantBpsDisplay');
        const avgBpmDisplay = document.getElementById('avgBpmDisplay');
        const avgBpsDisplay = document.getElementById('avgBpsDisplay');
        const predictionCard = document.getElementById('predictionCard');
        const predictionTitle = document.getElementById('predictionTitle');
        const predictionDisplay = document.getElementById('predictionDisplay');

        const resetBtn = document.getElementById('resetBtn');
        const resetModal = document.getElementById('resetModal');
        const cancelResetBtn = document.getElementById('cancelResetBtn');
        const confirmResetBtn = document.getElementById('confirmResetBtn');

        // 목표 시간 단계 테이블 (초 단위)
        const TARGET_STEPS = [30, 60, 90, 120, 150, 180];

        function formatTargetText(sec) {
            if (sec < 60) return `${sec}초`;
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return s === 0 ? `${m}분` : `${m}분 ${s}초`;
        }

        function updateTargetUI() {
            targetDisplay.textContent = formatTargetText(targetSeconds);
            const elapsedSec = elapsedMilliseconds / 1000;
            
            // 경과 시간보다 짧은 목표 단계로 줄이지 못하도록 버튼 제어
            const currentStepIdx = TARGET_STEPS.indexOf(targetSeconds);
            const prevStepVal = TARGET_STEPS[currentStepIdx - 1];

            if (currentStepIdx === 0 || (prevStepVal && elapsedSec >= prevStepVal)) {
                minusTargetBtn.disabled = true;
            } else {
                minusTargetBtn.disabled = false;
            }

            if (currentStepIdx === TARGET_STEPS.length - 1) {
                plusTargetBtn.disabled = true;
            } else {
                plusTargetBtn.disabled = false;
            }

            predictionTitle.textContent = `목표 시간(${formatTargetText(targetSeconds)}) 예상 횟수`;
        }

        // 스톱워치 실행
        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            const startTime = Date.now() - elapsedMilliseconds;

            timerInterval = setInterval(() => {
                elapsedMilliseconds = Date.now() - startTime;
                renderTimer();
                checkAutoTargetUpgrade();
            }, 50);

            // 1초 주기로 평균 및 예상 횟수 정기 갱신
            updateInterval = setInterval(() => {
                calculateMetrics();
            }, 1000);
        }

        function renderTimer() {
            const totalSec = elapsedMilliseconds / 1000;
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = Math.floor(totalSec % 60).toString().padStart(2, '0');
            const ms = Math.floor((totalSec % 1) * 10);
            timerDisplay.textContent = `${m}:${s}.${ms}`;
        }

        // 스톱워치가 목표 시간을 넘으면 자동으로 목표 시간을 상향 조절
        function checkAutoTargetUpgrade() {
            const elapsedSec = elapsedMilliseconds / 1000;

            if (elapsedSec > targetSeconds) {
                const currentIdx = TARGET_STEPS.indexOf(targetSeconds);
                if (currentIdx < TARGET_STEPS.length - 1) {
                    targetSeconds = TARGET_STEPS[currentIdx + 1];
                    updateTargetUI();
                } else {
                    // 3분 초과 시
                    updateTargetUI();
                }
            } else {
                updateTargetUI();
            }
        }

        // 탭 핸들러 (모바일 이중 반응 방지)
        function handleTap(e) {
            if (e.type === 'touchstart') {
                e.preventDefault(); // mobile click 중복 실행 차단
            }

            const now = Date.now();

            // 모바일 오터치 방지 (최소 120ms 이하 연타 무시 - 분당 500회 제한)
            if (lastTapTime && (now - lastTapTime < 120)) {
                return;
            }

            if (!isTimerRunning) {
                startTimer();
                firstTapTime = now;
            }

            count++;
            lastTapTime = now;
            tapTimes.push(now);

            // 최근 5개 타임스탬프만 유지 (이동 평균)
            if (tapTimes.length > 6) {
                tapTimes.shift();
            }

            // 시각 효과
            countDisplay.textContent = count;
            countDisplay.classList.add('pop');
            setTimeout(() => countDisplay.classList.remove('pop'), 50);

            calculateMetrics();
        }

        // 속도 및 예상 횟수 계산
        function calculateMetrics() {
            const now = Date.now();

            // 1. 순간 속도 계산 (최근 탭 이동 평균)
            if (tapTimes.length >= 2) {
                const recentCount = tapTimes.length - 1;
                const timeDiffSec = (tapTimes[tapTimes.length - 1] - tapTimes[0]) / 1000;
                
                if (timeDiffSec > 0) {
                    const instantBps = recentCount / timeDiffSec;
                    const instantBpm = Math.round(instantBps * 60);

                    instantBpmDisplay.innerHTML = `${instantBpm} <span style="font-size:0.9rem">BPM</span>`;
                    instantBpsDisplay.textContent = `${instantBps.toFixed(1)} BPS`;
                }
            }

            // 2. 평균 속도 계산
            const totalElapsedSec = elapsedMilliseconds / 1000;
            let avgBps = 0;
            let avgBpm = 0;

            if (totalElapsedSec > 0 && count > 0) {
                avgBps = count / totalElapsedSec;
                avgBpm = Math.round(avgBps * 60);

                avgBpmDisplay.innerHTML = `${avgBpm} <span style="font-size:0.9rem">BPM</span>`;
                avgBpsDisplay.textContent = `${avgBps.toFixed(1)} BPS`;
            }

            // 3. 목표 예상 횟수 계산 및 3분 초과 비활성화 처리
            if (totalElapsedSec > 180) {
                // 3분 초과시 비활성화
                predictionCard.classList.add('disabled');
                predictionDisplay.textContent = "OFF";
            } else {
                predictionCard.classList.remove('disabled');
                const predictedCount = Math.round(avgBps * targetSeconds);
                predictionDisplay.textContent = `${predictedCount} 회`;
            }
        }

        // 목표 시간 조절 이벤트
        minusTargetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const currentIdx = TARGET_STEPS.indexOf(targetSeconds);
            if (currentIdx > 0) {
                targetSeconds = TARGET_STEPS[currentIdx - 1];
                updateTargetUI();
                calculateMetrics();
            }
        });

        plusTargetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const currentIdx = TARGET_STEPS.indexOf(targetSeconds);
            if (currentIdx < TARGET_STEPS.length - 1) {
                targetSeconds = TARGET_STEPS[currentIdx + 1];
                updateTargetUI();
                calculateMetrics();
            }
        });

        // 이벤트 바인딩
        touchZone.addEventListener('touchstart', handleTap, { passive: false });
        touchZone.addEventListener('click', handleTap);

        // 초기화 처리
        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetModal.classList.add('active');
        });

        cancelResetBtn.addEventListener('click', () => {
            resetModal.classList.remove('active');
        });

        confirmResetBtn.addEventListener('click', () => {
            resetModal.classList.remove('active');
            resetAll();
        });

        function resetAll() {
            clearInterval(timerInterval);
            clearInterval(updateInterval);
            isTimerRunning = false;
            elapsedMilliseconds = 0;
            count = 0;
            tapTimes = [];
            firstTapTime = null;
            lastTapTime = null;

            countDisplay.textContent = '0';
            timerDisplay.textContent = '00:00.0';
            instantBpmDisplay.innerHTML = `0 <span style="font-size:0.9rem">BPM</span>`;
            instantBpsDisplay.textContent = '0.0 BPS';
            avgBpmDisplay.innerHTML = `0 <span style="font-size:0.9rem">BPM</span>`;
            avgBpsDisplay.textContent = '0.0 BPS';
            predictionDisplay.textContent = '0 회';
            
            predictionCard.classList.remove('disabled');
            targetSeconds = 30;
            updateTargetUI();
        }

        // 초기화 실행
        updateTargetUI();
    </script>
</body>
</html>
